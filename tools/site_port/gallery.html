<!doctype html>
<html lang="en" data-pal="white">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fbfbf9">
<title>Gallery · TDW website style · prototype</title>
<style>
__FONTS__
__BASECSS__
:root{--bg:#fbfbf9;--ink:#141414;--mute:#6e6e6a;--line:rgba(20,20,20,.14);--soft:#efefeb;--accent:#141414;--on-accent:#fbfbf9;--mat:#ffffff;--frame:#1b1b1b;--shadow:0 22px 40px -18px rgba(0,0,0,.35),0 4px 10px -4px rgba(0,0,0,.18);
 --serif:"Instrument Serif","Bodoni Moda",Georgia,serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif}
html[data-pal=grey]{--bg:#e6e5e0;--soft:#dcdbd5;--mute:#5f5e59}
html[data-pal=night]{--bg:#1b1b1a;--ink:#ecebe6;--mute:#9a9994;--line:rgba(236,235,230,.14);--soft:#252524;--accent:#ecebe6;--on-accent:#1b1b1a;--mat:#f4f2ec;--frame:#0c0c0c;--shadow:0 30px 60px -20px rgba(0,0,0,.8)}
html[data-font=b]{--serif:"Bodoni Moda",Didot,serif}
html[data-pal=night] .frame::after{content:"";position:absolute;left:-30%;right:-30%;top:-60%;height:80%;background:radial-gradient(ellipse at 50% 100%,rgba(255,240,210,.18),transparent 70%);pointer-events:none}
.lbl{display:block;font:400 12px/1.5 var(--sans);color:var(--mute)}.lbl b{display:block;color:var(--ink);font-weight:500}
.lbl i{font-family:var(--serif);font-size:15px;color:var(--ink)}
/* header */
.hd{position:fixed;inset:0 0 auto 0;z-index:30;height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--pad);font:500 12.5px/1 var(--sans);transition:background .4s}
.hd.solid{background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
.hd .l{justify-self:start;display:flex;gap:6px;align-items:center}.hd .r{justify-self:end;display:flex;gap:14px;align-items:center}
.wmt{font:500 13px/1 var(--sans);letter-spacing:.02em;white-space:nowrap}.hd .mono{display:none}.hd.use-mono .wmt{display:none}.hd.use-mono .mono{display:inline-flex}
.enq{font:500 12.5px/1 var(--sans);border-bottom:1px solid currentColor;padding-bottom:2px}.ml{font:500 12.5px var(--sans)}
.hd .r .heart{display:none}
/* frames */
.frame{position:relative;background:var(--mat);padding:7%;border:3px solid var(--frame);box-shadow:var(--shadow)}
.frame .ph{aspect-ratio:3/4;background:var(--soft)}
.hang{transform-origin:50% -40px}
.hang.rv{opacity:0;transform:translateY(-26px) rotate(-3deg)}
.hang.rv.in{opacity:1;animation:swing calc(2.2s * var(--k)) cubic-bezier(.25,.8,.3,1) both;transform:none}
@keyframes swing{0%{transform:translateY(-26px) rotate(-3deg);opacity:0}25%{opacity:1;transform:translateY(0) rotate(2deg)}45%{transform:rotate(-1.2deg)}65%{transform:rotate(.6deg)}82%{transform:rotate(-.25deg)}100%{transform:none}}
/* cover: walk up to the painting */
.enter{position:relative;height:250svh}
.enter .stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(12px,3vh,28px);padding:calc(72px + env(safe-area-inset-top,0px)) var(--pad) calc(18px + env(safe-area-inset-bottom,0px))}
.enter .head{position:relative;z-index:3;will-change:transform,opacity}
.enter .head h1{font:400 clamp(40px,min(13vw,11vh),150px)/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.enter .head p{margin:12px 0 0;font:400 13px/1.5 var(--sans);color:var(--mute);max-width:32ch}
.enter .big{position:relative;z-index:2;min-height:0;display:flex;align-items:center;justify-content:center;will-change:transform}
.enter #bigh{height:100%;max-width:100%;aspect-ratio:.8;display:flex}
.enter .frame{height:100%;width:100%;display:flex}.enter .frame .ph{flex:1;aspect-ratio:auto}
.enter .big .frame{transition:padding .2s linear,border-color .2s linear}
.enter .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;position:relative;z-index:3;will-change:transform,opacity}
.enter .wl{text-align:right;margin-left:auto}
.enter .hint{font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.enter .hint i{width:34px;height:1px;background:currentColor;transform-origin:left;animation:hint 2s var(--ease) infinite}
@keyframes hint{0%{transform:scaleX(0)}60%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
.enter .over{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--pad) calc(46px + env(safe-area-inset-bottom,0px));color:#fff;opacity:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 50%)}
.enter .over h2{font:400 clamp(40px,min(12vw,13vh),120px)/1.14 var(--serif);margin:12px 0 20px}
.enter .over .btn{background:#fff;color:#111;align-self:flex-start;pointer-events:auto}
/* exhibition */
section{padding:clamp(56px,12vw,120px) 0 0}
.sh{padding:0 var(--pad);margin-bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sh h2{font:400 clamp(36px,10.5vw,96px)/1.1 var(--serif);margin:8px 0 0;letter-spacing:-.01em}
.ex{display:flex;flex-direction:column;gap:clamp(56px,14vw,140px);padding:0 var(--pad)}
.card{display:grid;gap:14px;align-items:end;position:relative}
.card .frame{width:var(--w,78%)}
.card:nth-child(3n+1){--w:84%}.card:nth-child(3n+2){--w:64%;justify-items:end}.card:nth-child(3n){--w:74%;padding-left:10%}
.card:nth-child(3n+2) .lbl{text-align:right}
.card .frame .ph img{transition:transform 1.4s var(--ease)}.card:hover .frame .ph img{transform:scale(1.03)}
.card .row1{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.card .no{font:400 12px/1 var(--sans);color:var(--mute)}
.card .hbtn{margin-top:-10px}
.card .vidtag{position:absolute;z-index:3;left:50%;top:40%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.9);align-items:center;justify-content:center}
.card .vidtag svg{width:14px;height:14px;fill:#111;margin-left:3px}
/* sideways rail on a wire */
.side{position:relative;height:320svh;margin-top:clamp(56px,12vw,120px)}
.side .stage{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.side .t{padding:0 var(--pad);margin-bottom:5vh}
.side .t h2{font:400 clamp(34px,min(10.5vw,8vh),96px)/1.1 var(--serif);margin:8px 0 0}
.wire{display:none}
.track{position:relative;margin-top:10vh}.track::before{content:"";position:absolute;left:-50vw;width:600vw;top:-8vh;height:1px;background:var(--line)}
.track{display:flex;gap:18vw;padding:0 var(--pad);will-change:transform;align-items:flex-start}
.hung{flex:none;width:min(58vw,420px,calc((100svh - 340px) * .62));position:relative}
.hung::before,.hung::after{content:"";position:absolute;top:-8vh;height:8vh;width:1px;background:var(--mute);opacity:.6}
.hung::before{left:30%;transform:rotate(12deg);transform-origin:bottom}.hung::after{right:30%;transform:rotate(-12deg);transform-origin:bottom}
.hung:nth-child(odd){margin-top:4vh}.hung .frame .ph{aspect-ratio:4/5}.hung .lbl{margin-top:14px}
.hung .frame{animation:sway 6s ease-in-out infinite alternate;transform-origin:50% -8vh}
.hung:nth-child(2) .frame{animation-delay:-2s}.hung:nth-child(3) .frame{animation-delay:-4s}
@keyframes sway{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.count{padding:0 var(--pad);margin-top:4vh;font:500 12px var(--sans);display:flex;gap:10px;align-items:center}.count .bar{width:120px;height:1px;background:var(--line);position:relative}.count .bar b{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(var(--p,0))}
/* wall text */
.rev{padding:0 var(--pad);max-width:900px}
.q p{font:italic 400 clamp(28px,8vw,58px)/1.2 var(--serif);margin:0 0 18px;letter-spacing:-.01em}
.q .by{font:500 12px var(--sans);color:var(--mute)}
.qnav{display:flex;gap:18px;margin-top:22px;font:500 12px var(--sans)}.qnav button{border-bottom:1px solid currentColor;padding:6px 0}
.cat{padding:0 var(--pad);max-width:900px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line)}
.row .no{font:400 12px var(--sans);color:var(--mute)}.row .n{font:400 21px/1.25 var(--serif)}.row .v{font:500 12.5px var(--sans)}
.note{color:var(--mute);font-size:12.5px;margin:10px 0 0;border-top:1px solid var(--line);padding-top:14px}
.story{padding:0 var(--pad);display:grid;gap:26px}.story .frame{width:72%}.story .lead{font:400 clamp(28px,8vw,52px)/1.18 var(--serif);margin:10px 0 14px}.story p{color:var(--mute);max-width:44ch;margin:0}
.faq{padding:0 var(--pad);max-width:900px}.fq button{font:400 21px/1.25 var(--serif)}
footer{margin-top:clamp(70px,14vw,140px);padding:30px var(--pad) calc(90px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ask{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;width:100%;text-align:left}
.ask .t{font:italic 400 clamp(34px,10vw,90px)/1.12 var(--serif)}
.ask .go{flex:none;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;transition:transform .5s var(--ease)}.ask:hover .go{transform:rotate(-45deg)}
.fname{font:400 60px/1.15 var(--serif);white-space:nowrap;margin:60px 0 26px}
.fl{display:flex;flex-wrap:wrap;gap:10px 22px;font:500 12.5px var(--sans)}.credit{margin-top:20px;color:var(--mute);font-size:12px}
/* chrome dress: wall panel */
.lp{transform:translateX(100%);opacity:1;visibility:hidden;transition:transform .85s var(--wipe),visibility 0s .85s}
.lp.on{transform:none;visibility:visible;opacity:1;transition:transform .85s var(--wipe)}.lp.closing{transform:translateX(100%);opacity:1}
.lp .top{color:var(--ink)}.gal{margin-top:0}.gal .strip .ph{background:var(--soft)}
.lpt{font-family:var(--serif)}.btn{text-transform:none;letter-spacing:.01em;font:500 13.5px/1 var(--sans)}
.btn-main{background:var(--ink);color:var(--bg)}.btn-alt{border:1px solid var(--ink)}
.drawer{width:100vw;transform:translateY(-102%)}.drawer.on{transform:none}
#dnav a{font:400 clamp(36px,10vw,72px)/1.1 var(--serif);transform:translateY(16px)}#dnav a em{font:500 11px var(--sans);opacity:.5}
.chip{text-transform:none;letter-spacing:0;font:500 12.5px var(--sans)}
.gal .dots i{background:rgba(0,0,0,.2)}.gal .dots i.on{background:var(--ink)}.gal .ctr{color:var(--ink)}
@media (min-width:700px){.hd .l .heart{display:none}.hd .r .heart{display:inline-flex}}
@media (min-width:1024px){
 .ex{display:grid;grid-template-columns:repeat(12,1fr);gap:120px 2vw;max-width:1400px;margin:0 auto}
 .card{grid-column:span 5}.card:nth-child(4n+2){grid-column:8 / span 4;margin-top:140px}.card:nth-child(4n+3){grid-column:2 / span 4}.card:nth-child(4n){grid-column:7 / span 6;margin-top:80px}
 .card .frame{width:100%}.card:nth-child(3n){padding-left:0}
 .hung{width:min(24vw,calc((100svh - 340px) * .62))}.track{gap:9vw}.story{grid-template-columns:5fr 7fr;align-items:center;max-width:1300px;margin:0 auto}.story .frame{width:80%}
}
@media (prefers-reduced-motion:reduce){.enter,.side{height:auto}.enter .stage,.side .stage{position:relative;height:auto;padding:100px 0 40px}.enter .over{display:none}.hang.rv{opacity:1!important;transform:none!important;animation:none!important}.hung .frame{animation:none}.track{flex-wrap:wrap;gap:40px}}
</style>
</head>
<body>
<header class="hd" id="hd">
 <div class="l"><button class="ib" data-menu aria-label="Menu"><span class="ml">Menu</span></button><button class="ib heart" data-hh aria-label="Saved"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1z"/></svg><span class="n" data-hc>0</span></button></div>
 <a class="wm" href="#top"><span class="wmt" data-name></span><span class="mono" data-mono></span></a>
 <div class="r"><button class="ib heart" data-hh aria-label="Saved"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1z"/></svg><span class="n" data-hc>0</span></button><button class="enq" data-eliza>Enquire</button></div>
</header>
<main id="top">
 <div class="enter" id="enter"><div class="stage">
  <div class="head" id="ehead"><h1 class="fitlines" id="eh1"></h1><p id="ep"></p></div>
  <div class="big" id="big"><div class="hang rv" id="bigh"><div class="frame" id="bigf"><div class="ph" id="bigph"></div></div></div></div>
  <div class="foot" id="efoot"><div class="hint" id="hint"><i></i>Scroll to enter</div><div class="wl lbl" id="ewl"></div></div>
  <div class="over" id="over"><span class="lbl" style="color:rgba(255,255,255,.8)" id="ok"></span><h2 id="oh"></h2><a class="btn" href="#looks"><span id="ob"></span><span class="ar">→</span></a></div>
 </div></div>
 <section id="looks"><div class="sh rv"><div><span class="lbl" data-items></span><h2 id="lh"></h2></div><span class="lbl" id="lcount"></span></div><div class="ex" id="ex"></div></section>
 <div class="side" id="side"><div class="stage"><div class="t"><span class="lbl">Collections</span><h2>On the wall this season</h2></div><div class="wire"></div><div class="track" id="track"></div><div class="count"><span id="cn">01</span><span class="bar"><b id="cbar"></b></span><span>04</span></div></div></div>
 <section id="reviews"><div class="rev"><span class="lbl rv">Wall text · Kind words</span><div id="qwrap" style="margin-top:14px"></div><div class="qnav"><button id="qPrev">Previous</button><button id="qNext">Next</button><span id="qCt" class="lbl">1 / 3</span></div></div></section>
 <section id="pricing"><div class="sh rv"><div><span class="lbl">Catalogue</span><h2>Starting from</h2></div></div><div class="cat" id="price"></div></section>
 <section id="story"><div class="story"><div class="frame hang rv" id="storyF"><div class="ph" id="storyPh"></div></div><div><span class="lbl rv">The studio</span><p class="lead rv" id="sl"></p><p class="rv" id="sp"></p></div></div></section>
 <section id="faq"><div class="sh rv"><div><span class="lbl">Questions</span><h2>Before you ask</h2></div></div><div class="faq" id="faql"></div></section>
 <footer><button class="ask rv" data-eliza><span class="t">Ask about your date</span><span class="go">→</span></button><div class="fname rv" data-fill="200" data-name></div><div class="fl"><a href="#looks" data-items></a><a href="#side">Collections</a><a href="#pricing">Pricing</a><a href="#top">Instagram</a><a href="#top">WhatsApp</a></div><div class="credit">Made with The Dream Wedding</div></footer>
</main>
<script>
const IMG=__IMGS__;
const STYLE={over:['.over','.card .vidtag'],title:'Gallery',palettes:[['white','White wall'],['grey','Gallery grey'],['night','Night gallery (dark)']],fonts:[['6','Instrument Serif · Instrument Sans'],['1','Bodoni Moda · Inter Tight'],['3','Italiana · Jost']],lookOpen:'wall',wmMin:11,
 covers:['staircase','pavilion','sikh-couple'], med:{makeup:'Bridal makeup and hair',photo:'Photograph, archival print',performer:'Live performance, film',planner:'Wedding, three days'},
 heads:{makeup:['Bridal makeup and hair, New Delhi. Twenty-four looks from the 2026 season, hung one by one.','The staircase','See the looks'],photo:['Wedding photography, New Delhi. Stories from the 2026 season, hung one by one.','The staircase','See the work'],performer:['Live music for weddings, New Delhi. Sets from the 2026 season.','The sangeet','Watch the acts'],planner:['Wedding planning, New Delhi. Weddings from the 2026 season.','The staircase','See the events']},
 render(c){const {w,looks,pic,lq,rs,heartBtn,qHTML,FAQ,PLAY,name,S}=c;const $=s=>document.querySelector(s);this.S=S;
  const H=this.heads[S.trade];$('#eh1').innerHTML=`<span class="ln"><span>${name}</span></span>`;$('#ep').textContent=H[0];
  $('#bigph').innerHTML=pic('staircase',{hero:true,sizes:'(min-width:1024px) 100vw, 100vw'});$('#bigph').setAttribute('style',lq('staircase'));
  $('#ewl').innerHTML=`<b>${H[1]}</b><i>${w.names[4]}</i>, 2026<br>${this.med[S.trade]}`;$('#ok').textContent='No. 01 · '+this.med[S.trade];$('#oh').textContent=H[1];$('#ob').textContent=H[2];
  $('#lh').textContent={makeup:'The exhibition',photo:'The exhibition',performer:'The programme',planner:'The exhibition'}[S.trade];$('#lcount').textContent=looks.length+' works';
  $('#ex').innerHTML=looks.map(L=>`<a class="card" href="#" data-i="${L.i}"><div class="frame hang rv"><div class="ph" style="${lq(L.a)}">${pic(L.a,{sizes:'(min-width:1024px) 34vw, 80vw'})}</div><span class="vidtag">${PLAY}</span></div>
   <div class="row1" style="width:var(--w)"><div class="lbl rv"><span class="no">No. ${String(L.i+1).padStart(2,'0')}</span><b><i>${L.name}</i>, 2026</b>${this.med[S.trade]} · ${L.cat}<br>From ${rs(L.price)}</div>${heartBtn(L.i)}</div></a>`).join('');
  $('#track').innerHTML=['arch','pavilion','mandap-sea','sikh-couple'].map((k,i)=>`<a class="hung" href="#side"><div class="frame"><div class="ph" style="${lq(k)}">${pic(k,{sizes:'(min-width:1024px) 24vw, 58vw'})}</div></div><div class="lbl"><b>${w.coll[i]}</b>${6+i*2} ${w.items.toLowerCase()}</div></a>`).join('');
  $('#qwrap').innerHTML=qHTML();
  $('#price').innerHTML=w.price.map((p,i)=>`<div class="row rv" style="--d:${i*.08}s"><span class="no">${String(i+1).padStart(2,'0')}</span><span class="n">${p[0]}</span><span class="v">${typeof p[1]==='number'?'From '+rs(p[1]):p[1]}</span></div>`).join('')+`<p class="note rv">Prices are set by the studio. Your quote follows a short call about the day.</p>`;
  $('#storyPh').innerHTML=pic('pavilion',{sizes:'(min-width:1024px) 40vw, 72vw'});$('#storyPh').setAttribute('style',lq('pavilion'));
  $('#sl').textContent=w.lead;$('#sp').textContent=name+' works from New Delhi and travels across India for weddings. Every booking is handled by the studio itself, from the first call to the last photograph of the night.';
  $('#faql').innerHTML=FAQ.map(f=>`<div class="fq rv"><button>${f[0]}<span class="pm"></span></button><div class="ans"><div><p>${f[1]}</p></div></div></div>`).join('')},
 after({RM}){document.getElementById('eh1').classList.add('in');setTimeout(()=>document.getElementById('bigh').classList.add('in'),350);this.scroll(scrollY,{RM,S:this.S})},
 scroll(y,{RM,S}){if(RM)return;const en=document.getElementById('enter');if(en){const r=en.getBoundingClientRect();const tot=r.height-innerHeight;const p=Math.max(0,Math.min(1,-r.top/tot));
   const big=document.getElementById('big'),f=document.getElementById('bigf'),fr=document.getElementById('bigh');const bw=fr.offsetWidth,bh=fr.offsetHeight;const s=Math.max(innerWidth/bw,innerHeight/bh)*1.18;
   const w0=Math.min(1,p/.12);const e=Math.max(0,Math.min(1,(p-.12)/.58));const ee=e*e*(3-2*e);   /* words leave in the first 12%, the frame grows only after */
   const cy=innerHeight/2-(big.offsetTop+big.offsetHeight/2);big.style.transform=`translate3d(0,${cy*ee}px,0) scale(${1+(s-1)*ee})`;
   f.style.padding=(7*(1-ee))+'%';f.style.borderWidth=(3*(1-ee))+'px';
   const hd=document.getElementById('ehead'),ft=document.getElementById('efoot');hd.style.opacity=1-w0;hd.style.transform=`translate3d(0,${-40*w0}px,0)`;ft.style.opacity=1-w0;ft.style.transform=`translate3d(0,${40*w0}px,0)`;hd.style.visibility=ft.style.visibility=w0>=1?'hidden':'visible';
   const o=document.getElementById('over');const op=Math.max(0,Math.min(1,(p-.72)/.2));o.style.opacity=op;o.style.pointerEvents=op>.5?'auto':'none'}
  const sd=document.getElementById('side');if(sd){const r=sd.getBoundingClientRect();const tot=r.height-innerHeight;const p=Math.max(0,Math.min(1,-r.top/tot));const tr=document.getElementById('track');const max=tr.scrollWidth-innerWidth+40;tr.style.transform=`translate3d(${-p*max}px,0,0)`;
   document.getElementById('cbar').style.setProperty('--p',p.toFixed(3));document.getElementById('cn').textContent='0'+(1+Math.min(3,Math.floor(p*4*.999)))}},
 solidAt(){const en=document.getElementById('enter');return en?en.offsetHeight-80:400}
};
__ENGINE__
</script>
